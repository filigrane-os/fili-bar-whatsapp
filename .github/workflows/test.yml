name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-icalendar python3-dateutil curl
      - name: Tests
        run: sh tests/run.sh
